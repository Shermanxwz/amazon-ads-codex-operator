# Project-scoped Codex configuration for Amazon Ads autonomous operation.
# OAuth credentials are stored by Codex locally and must never be committed.

[mcp_servers.amazon_ads]
url = "https://advertising-ai.amazon.com/mcp"
auth = "oauth"
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 180
# Full-managed mode is intentionally non-interactive. MCP tool calls are
# explicitly approved here; the deterministic Python controller authorizes
# only exact HMAC-sealed actions before the Executor receives them.
default_tools_approval_mode = "approve"
