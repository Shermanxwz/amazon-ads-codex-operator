# Development/project-scoped MCP configuration. Production automation uses the
# dedicated CODEX_HOME under ADS_OWNER_HOME so Codex cannot rewrite its own
# standing authority. Writes remain gated by default; the deterministic sealed
# Executor overrides this to `approve` for one atomic action at a time.
[mcp_servers.amazon_ads]
url = "https://advertising-ai.amazon.com/mcp"
auth = "oauth"
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 180
default_tools_approval_mode = "writes"
