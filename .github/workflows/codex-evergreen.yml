name: codex-evergreen-compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    paths:
      - '.github/workflows/codex-evergreen.yml'
      - 'config/codex-compatibility.json'
      - 'src/ads_autopilot/codex_runner.py'
      - 'src/ads_autopilot/codex_compat/**'
      - 'scripts/check_codex_runtime.py'
      - 'scripts/install_codex_ubuntu.sh'
      - 'scripts/configure_amazon_mcp.sh'
      - 'scripts/configure_codex_plugin.sh'
  pull_request:
    paths:
      - '.github/workflows/codex-evergreen.yml'
      - 'config/codex-compatibility.json'
      - 'src/ads_autopilot/codex_runner.py'
      - 'src/ads_autopilot/codex_compat/**'
      - 'scripts/check_codex_runtime.py'
      - 'scripts/install_codex_ubuntu.sh'
      - 'scripts/configure_amazon_mcp.sh'
      - 'scripts/configure_codex_plugin.sh'

permissions:
  contents: read

concurrency:
  group: codex-evergreen-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-codex:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install current official Codex candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          command -v codex
          codex --version
      - name: Probe stable Codex capability contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_codex_runtime.py --binary "$(command -v codex)" --json | tee codex-compatibility-report.json
