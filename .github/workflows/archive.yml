name: archive-gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: archive-python-${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
      - name: Install pinned archive tooling
        run: python -m pip install --disable-pip-version-check setuptools==84.0.0 wheel==0.48.0 pytest==9.1.1
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q
      - name: Archive gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/archive_check.py
