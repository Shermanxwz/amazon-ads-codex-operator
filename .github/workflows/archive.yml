name: archive-gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: archive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: archive-python-${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
      - name: Record fresh-host evidence
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          python --version
          git --version
      - name: Install fully pinned archive tooling
        run: python -m pip install --disable-pip-version-check --no-deps -r config/archive-tooling.txt
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q
      - name: Archive gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/archive_check.py

  virtual-acceptance:
    name: virtual-full-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Record fresh-host evidence
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          python --version
          git --version
      - name: Create isolated Python environment
        run: python -m venv .acceptance-venv
      - name: Install fully pinned tooling in isolated environment
        run: .acceptance-venv/bin/python -m pip install --disable-pip-version-check --no-deps -r config/archive-tooling.txt
      - name: Reproducible sealed wheel build and install
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          rm -rf virtual-dist
          mkdir -p virtual-dist/first virtual-dist/second
          .acceptance-venv/bin/python -m pip wheel . --no-deps --no-build-isolation -w virtual-dist/first
          .acceptance-venv/bin/python -m pip wheel . --no-deps --no-build-isolation -w virtual-dist/second
          first="$(find virtual-dist/first -maxdepth 1 -name '*.whl' -print -quit)"
          second="$(find virtual-dist/second -maxdepth 1 -name '*.whl' -print -quit)"
          [[ -n "$first" && -n "$second" ]]
          cmp "$first" "$second"
          sha256sum "$first" "$second"
          cp "$first" virtual-dist/
          .acceptance-venv/bin/python -m pip install --no-deps virtual-dist/*.whl
          .acceptance-venv/bin/python - <<'PY'
          import ads_autopilot
          print('installed_version=' + ads_autopilot.__version__)
          PY
      - name: Full virtual production acceptance
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .acceptance-venv/bin/python scripts/virtual_acceptance.py --report virtual-acceptance-report.json
      - name: Print virtual acceptance evidence
        if: always()
        run: cat virtual-acceptance-report.json || true
