name: archive-gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tooling
        run: python -m pip install --upgrade setuptools wheel pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Archive gate
        run: python scripts/archive_check.py
