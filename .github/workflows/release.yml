name: sealed-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          check-latest: false
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          PY
          )"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 2
          fi
          notes="docs/RELEASE_${GITHUB_REF_NAME^^}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes missing: $notes" >&2
            exit 2
          fi
          git fetch -q origin main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Release tag must point exactly at the current main HEAD: tag=$GITHUB_SHA main=$main_sha" >&2
            exit 3
          fi
      - name: Install pinned archive tooling
        run: python -m pip install --disable-pip-version-check setuptools==84.0.0 wheel==0.48.0 pytest==9.1.1
      - name: Re-run source archive gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/archive_check.py
      - name: Build sealed artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          git archive --format=tar.gz --prefix="amazon-ads-codex-operator-${GITHUB_REF_NAME}/" -o "dist/amazon-ads-codex-operator-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"

          amazon_commit="$(python3 - <<'PY'
          import json
          print(json.load(open('vendor/amazon-postman/CERTIFIED_UPSTREAM.json'))['commit'])
          PY
          )"
          codex_contract_sha256="$(sha256sum config/codex-compatibility.json | awk '{print $1}')"
          cat > dist/RELEASE_IDENTITY.json <<EOF
          {
            "tag": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "repository": "$GITHUB_REPOSITORY",
            "source_archive_gate": "passed",
            "certified_amazon_postman_commit": "$amazon_commit",
            "codex_compatibility_sha256": "$codex_contract_sha256"
          }
          EOF

          (
            cd dist
            sha256sum *.whl *.tar.gz RELEASE_IDENTITY.json > SHA256SUMS
          )
          cat dist/RELEASE_IDENTITY.json
          cat dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/RELEASE_${GITHUB_REF_NAME^^}.md"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            dist/RELEASE_IDENTITY.json \
            --verify-tag \
            --title "Amazon Ads Codex Operator $GITHUB_REF_NAME" \
            --notes-file "$notes"
