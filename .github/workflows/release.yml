name: sealed-release

on:
  workflow_run:
    workflows: [archive-gate]
    types: [completed]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: sealed-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Validate exact green main identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || { echo "Archive-passing SHA is no longer main HEAD" >&2; exit 2; }
          version="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          PY
          )"
          tag="v$version"
          notes="docs/RELEASE_${tag^^}.md"
          [[ -f "$notes" ]] || { echo "Release notes missing: $notes" >&2; exit 2; }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/tmp/tag.json 2>/dev/null; then
            tagged="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/tag.json'))['object']['sha'])
          PY
          )"
            [[ "$tagged" == "$RELEASE_SHA" ]] || { echo "Tag $tag already seals another SHA; bump version before changing main" >&2; exit 3; }
            echo "Tag $tag already seals this SHA; publish step is idempotent."
          fi
      - name: Install fully pinned archive tooling
        run: python -m pip install --disable-pip-version-check --no-deps -r config/archive-tooling.txt
      - name: Re-run source archive gate on sealed SHA
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python scripts/archive_check.py
      - name: Build byte-reproducible sealed artifacts
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          mkdir -p dist/repro-wheel-a dist/repro-wheel-b
          python -m pip wheel . --no-deps --no-build-isolation -w dist/repro-wheel-a
          python -m pip wheel . --no-deps --no-build-isolation -w dist/repro-wheel-b
          wheel_a="$(find dist/repro-wheel-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist/repro-wheel-b -maxdepth 1 -name '*.whl' -print -quit)"
          [[ -n "$wheel_a" && -n "$wheel_b" ]]
          cmp "$wheel_a" "$wheel_b"
          cp "$wheel_a" dist/
          rm -rf dist/repro-wheel-a dist/repro-wheel-b

          prefix="amazon-ads-codex-operator-${RELEASE_TAG}/"
          git archive --format=tar.gz --prefix="$prefix" -o dist/source-a.tar.gz "$RELEASE_SHA"
          git archive --format=tar.gz --prefix="$prefix" -o dist/source-b.tar.gz "$RELEASE_SHA"
          cmp dist/source-a.tar.gz dist/source-b.tar.gz
          mv dist/source-a.tar.gz "dist/amazon-ads-codex-operator-${RELEASE_TAG}.tar.gz"
          rm dist/source-b.tar.gz

          amazon_commit="$(python3 - <<'PY'
          import json
          print(json.load(open('vendor/amazon-postman/CERTIFIED_UPSTREAM.json'))['commit'])
          PY
          )"
          codex_contract_sha256="$(sha256sum config/codex-compatibility.json | awk '{print $1}')"
          tooling_sha256="$(sha256sum config/archive-tooling.txt | awk '{print $1}')"
          cat > dist/RELEASE_IDENTITY.json <<IDENTITY
          {
            "tag": "$RELEASE_TAG",
            "commit": "$RELEASE_SHA",
            "repository": "$GITHUB_REPOSITORY",
            "source_archive_gate": "passed",
            "build_reproducibility": "double-build-byte-identical",
            "source_date_epoch": "$SOURCE_DATE_EPOCH",
            "certified_amazon_postman_commit": "$amazon_commit",
            "codex_compatibility_sha256": "$codex_contract_sha256",
            "archive_tooling_sha256": "$tooling_sha256"
          }
          IDENTITY
          (cd dist && sha256sum *.whl *.tar.gz RELEASE_IDENTITY.json > SHA256SUMS)
          cat dist/RELEASE_IDENTITY.json
          cat dist/SHA256SUMS
      - name: Attest sealed release subjects
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish immutable-by-version GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA" >/dev/null
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists for this sealed SHA."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            dist/RELEASE_IDENTITY.json \
            --verify-tag \
            --title "Amazon Ads Codex Operator $RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES"
