name: single-main-branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: single-main-branch
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete every non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting non-main branch: $branch"
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
          done
          # GitHub's branch listing is eventually consistent after ref deletion.
          # Verify the invariant with bounded retries rather than accepting a
          # stale index response as a failure.
          for attempt in {1..10}; do
            mapfile -t remaining < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
            printf 'Verification attempt %s; remaining branches: %s\n' "$attempt" "${remaining[*]}"
            if [[ "${#remaining[@]}" -eq 1 && "${remaining[0]}" == "main" ]]; then
              exit 0
            fi
            sleep 1
          done
          echo "Repository did not converge to main-only branch state" >&2
          exit 1
